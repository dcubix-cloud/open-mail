<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset=".45" stop-color="#b9d0fb"/>
      <stop offset="1" stop-color="#3a68d8"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#1546c4"/>
      <stop offset=".5" stop-color="#3f7cf0"/>
      <stop offset="1" stop-color="#0b2a8c"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f9ff7"/>
      <stop offset=".6" stop-color="#2a5fe0"/>
      <stop offset="1" stop-color="#9cc0ff"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".7" stop-color="#dce9ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="warm" cx=".12" cy=".18" r=".5">
      <stop offset="0" stop-color="#ffe6c7" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffe6c7" stop-opacity="0"/>
