  <path d="M-120 600 C 300 430 620 820 1040 560 S 1520 390 1720 520" fill="none" stroke="url(#silk)" stroke-width="22" filter="url(#soft)"/>
  <path d="M-120 760 C 340 620 700 960 1120 720 S 1560 610 1720 700 L 1720 1100 L -120 1100 Z" fill="#0a2373" opacity=".85" filter="url(#soft)"/>
